[users]
auto_assign_org = false
allow_org_create = false

[auth.anonymous]
enabled = false

[security]
allow_embedding = true

[server.custom_response_headers]
Referrer-Policy = no-referrer

[auth.jwt]
enabled = true
header_name = X-JWT-Assertion
url_login = true
auto_sign_up = true
username_claim = username
email_claim = email
key_file = /etc/grafana/jwt/jwt-public.pem
expect_claims = {"iss": "grafana-iframe-poc", "aud": "grafana-iframe-poc"}
org_attribute_path = [company_id]
org_mapping = 1:3:Viewer 2:4:Viewer
role_attribute_path =
role_attribute_strict = true
allow_assign_grafana_admin = false
skip_org_role_sync = false
